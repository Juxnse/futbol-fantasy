<app-header (toggleMenu)="toggleMenu()"></app-header>

<mat-sidenav-container class="app-layout">
  <!-- Menú lateral -->
  <mat-sidenav #drawer mode="side" [(opened)]="opened">
    <app-menu></app-menu>
  </mat-sidenav>

  <!-- Contenido principal -->
  <mat-sidenav-content>
    <main class="main-container">
      <router-outlet></router-outlet>
    </main>
    <app-footer></app-footer>
  </mat-sidenav-content>
</mat-sidenav-container>
