<div class="team">
  <header class="head">
    <h1>Elige tu <span>alineación</span></h1>
    <p class="sub">Define la estructura para tu once inicial.</p>
  </header>

  <mat-form-field appearance="outline" class="selector">
    <mat-label>Formación</mat-label>
    <mat-select [value]="selectedFormationId" (selectionChange)="onFormationChange($event.value)">
      <mat-option *ngFor="let f of formations" [value]="f.id">
        {{ f.label }} — {{ f.meta }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <section class="lines">
    <article class="line">
      <div class="line-title">GK</div>
      <div class="slots">
        <button class="slot gk" *ngFor="let _ of slots.GK" mat-stroked-button>
          <mat-icon>person</mat-icon> Portero
        </button>
      </div>
    </article>

    <article class="line">
      <div class="line-title">DF</div>
      <div class="slots">
        <button class="slot df" *ngFor="let _ of slots.DF" mat-stroked-button>
          <mat-icon>person</mat-icon> Defensa
        </button>
      </div>
    </article>

    <article class="line">
      <div class="line-title">MF</div>
      <div class="slots">
        <button class="slot mf" *ngFor="let _ of slots.MF" mat-stroked-button>
          <mat-icon>person</mat-icon> Medio
        </button>
      </div>
    </article>

    <article class="line">
      <div class="line-title">FW</div>
      <div class="slots">
        <button class="slot fw" *ngFor="let _ of slots.FW" mat-stroked-button>
          <mat-icon>person</mat-icon> Delantero
        </button>
      </div>
    </article>
  </section>

  <footer class="actions">
    <button mat-stroked-button routerLink="/home">Cancelar</button>
    <button mat-raised-button color="primary" (click)="continue()">Confirmar alineación</button>
  </footer>
</div>
