<h2 mat-dialog-title>Crear nuevo torneo</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="form-container">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre del torneo</mat-label>
      <input matInput formControlName="name" placeholder="Ej. Liga BetPlay Fans">
      <mat-error *ngIf="form.get('name')?.invalid">Nombre requerido</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Visibilidad</mat-label>
      <mat-select formControlName="visibility">
        <mat-option value="PUBLIC">Público</mat-option>
        <mat-option value="PRIVATE">Privado</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Máx. equipos</mat-label>
      <input type="number" matInput formControlName="maxTeams" min="2">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Fecha de inicio</mat-label>
      <input matInput type="date" formControlName="startAt">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Fecha de fin</mat-label>
      <input matInput type="date" formControlName="endAt">
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button color="warn" (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="form.invalid">
    Guardar
  </button>
</mat-dialog-actions>
