<header class="header">
  <div class="logo">
    <button mat-icon-button (click)="toggleMenu.emit()">
      <mat-icon>menu</mat-icon>
    </button>
    ⚽ Fútbol Fantasy Colombia
  </div>

  <!-- Botones según sesión -->
  <div class="auth-buttons" *ngIf="!isLoggedIn()">
    <button mat-raised-button color="primary" routerLink="/register">Registrarse</button>
    <button mat-raised-button color="primary" routerLink="/login">Iniciar Sesión</button>
  </div>

  <div class="user-actions" *ngIf="isLoggedIn()">
    <span>{{ user?.name }}</span>
    <img [src]="user?.picture" alt="Usuario" class="user-avatar" />
    <button mat-icon-button [matMenuTriggerFor]="menu">
      <mat-icon>arrow_drop_down</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar Sesión</span>
      </button>
    </mat-menu>
  </div>
</header>
