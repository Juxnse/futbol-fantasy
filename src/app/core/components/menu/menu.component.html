<nav class="menu">
  <ul>
    <li>
      <a routerLink="/home" routerLinkActive="active">
        <mat-icon>home</mat-icon>
        <span>Inicio</span>
      </a>
    </li>

    <li>
      <a routerLink="/about" routerLinkActive="active">
        <mat-icon>info</mat-icon>
        <span>Sobre nosotros</span>
      </a>
    </li>

    <!-- ⚽ MI EQUIPO (con acordeón + / -) -->
    <li class="submenu">
      <div class="submenu-title" (click)="toggleEquipoMenu()">
        <div class="title-left">
          <mat-icon>sports_soccer</mat-icon>
          <span>Mi equipo</span>
        </div>
        <mat-icon class="toggle-icon">
          {{ showEquipoMenu ? 'remove' : 'add' }}
        </mat-icon>
      </div>

      <div class="submenu-content" [class.open]="showEquipoMenu">
        <!-- Usuario logueado -->
        <ng-container *ngIf="user; else guest">
          <a
            *ngIf="!equipoGuardado"
            routerLink="/equipos/crear"
            (click)="navigate('/equipos/crear')"
          >
            <mat-icon>add_circle</mat-icon>
            <span>Crear equipo</span>
          </a>

          <a
            *ngIf="equipoGuardado"
            routerLink="/equipos/visual"
            (click)="navigate('/equipos/visual')"
          >
            <mat-icon>visibility</mat-icon>
            <span>Ver tablero táctico</span>
          </a>

          <a
            *ngIf="equipoGuardado"
            routerLink="/equipos/mi-equipo"
            (click)="navigate('/equipos/mi-equipo')"
          >
            <mat-icon>edit</mat-icon>
            <span>Editar alineación</span>
          </a>
        </ng-container>

        <!-- Usuario no logueado -->
        <ng-template #guest>
          <a (click)="openTeam($event)">
            <mat-icon>login</mat-icon>
            <span>Iniciar sesión</span>
          </a>
        </ng-template>
      </div>
    </li>

    <li>
      <a routerLink="/tournaments" routerLinkActive="active">
        <mat-icon>emoji_events</mat-icon>
        <span>Torneos</span>
      </a>
    </li>

    <li>
      <a routerLink="/profile" routerLinkActive="active">
        <mat-icon>person</mat-icon>
        <span>Perfil</span>
      </a>
    </li>
  </ul>
</nav>
