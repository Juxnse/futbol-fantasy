<div class="home-container">
  <h1>Bienvenido a <span>Fútbol Fantasy Colombia</span></h1>
  <p>Arma tu equipo con jugadores de la <b>Liga BetPlay</b> y compite con tus amigos.</p>

  <!-- Cancha -->
  <div class="cancha-container">
    <svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid meet">
      <rect x="0" y="0" width="600" height="800" fill="green" stroke="white" stroke-width="5"/>
      <line x1="0" y1="400" x2="600" y2="400" stroke="white" stroke-width="4"/>
      <rect x="150" y="0" width="300" height="120" fill="none" stroke="white" stroke-width="4"/>
      <rect x="150" y="680" width="300" height="120" fill="none" stroke="white" stroke-width="4"/>
      <g id="players">
        <ng-container *ngFor="let p of players">
          <circle [attr.cx]="p.x" [attr.cy]="p.y" r="25" [attr.fill]="p.color"/>
          <text [attr.x]="p.x" [attr.y]="p.y+6" text-anchor="middle" font-size="16" fill="white" font-weight="bold">
            {{p.number}}
          </text>
        </ng-container>
      </g>
    </svg>
  </div>
</div>
